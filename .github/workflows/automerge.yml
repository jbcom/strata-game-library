# Automerge - Auto-merge Dependabot and Release Please PRs after CI passes
#
# Enables native auto-merge for trusted release-please PRs and grouped
# Dependabot non-major updates. Those branches deliberately skip CI.
name: Automerge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Auto-merge only non-major Dependabot groups. Major upgrades stay human-reviewed.
  # ────────────────────────────────────────────────────────────────────
  dependabot:
    name: Dependabot Auto-merge
    if: >-
      github.actor == 'dependabot[bot]' &&
      (startsWith(github.head_ref, 'dependabot/npm_and_yarn/non-major-dependencies-') ||
       startsWith(github.head_ref, 'dependabot/github_actions/actions-non-major-'))
    runs-on: ubuntu-latest
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GH_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
    steps:
      - name: Enable auto-merge
        run: gh pr merge "$PR_URL" --auto --squash

  # ────────────────────────────────────────────────────────────────────
  # Approve and auto-merge Release Please PRs
  # ────────────────────────────────────────────────────────────────────
  release-please:
    name: Release Please Auto-merge
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GH_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
    steps:
      - name: Enable auto-merge
        run: gh pr merge "$PR_URL" --auto --squash
