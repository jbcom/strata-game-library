name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    name: Conventional PR title
    if: >-
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'release-please--') &&
      !startsWith(github.head_ref, 'dependabot/npm_and_yarn/non-major-dependencies-') &&
      !startsWith(github.head_ref, 'dependabot/github_actions/actions-non-major-')
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Validate title
        shell: bash
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|refactor|perf|docs|test|build|ci|chore|style|revert)(\([a-z0-9._/-]+\))?!?:[[:space:]].+ ]]; then
            echo "PR titles must use Conventional Commits, for example: feat(core): add world snapshots" >&2
            exit 1
          fi

  toolchain:
    name: Runtime compatibility matrix
    if: >-
      github.event_name != 'pull_request' ||
      (!startsWith(github.head_ref, 'release-please--') && !startsWith(github.head_ref, 'dependabot/npm_and_yarn/non-major-dependencies-') && !startsWith(github.head_ref, 'dependabot/github_actions/actions-non-major-'))
    runs-on: ubuntu-latest
    outputs:
      node-versions: ${{ steps.matrix.outputs.node-versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive supported runtimes
        id: matrix
        shell: bash
        run: |
          floor=$(jq -r '.engines.node' package.json | grep -Eo '[0-9]+' | head -1)
          echo "node-versions=[\"${floor}\",\"latest\"]" >> "$GITHUB_OUTPUT"

  compatibility:
    name: Node ${{ matrix.node }} compatibility
    if: >-
      github.event_name != 'pull_request' ||
      (!startsWith(github.head_ref, 'release-please--') && !startsWith(github.head_ref, 'dependabot/npm_and_yarn/non-major-dependencies-') && !startsWith(github.head_ref, 'dependabot/github_actions/actions-non-major-'))
    needs: toolchain
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.toolchain.outputs.node-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ matrix.node }}
      - name: Test the renderer-agnostic core
        run: pnpm nx run @strata-game-library/core:test

  quality:
    name: ${{ matrix.task }}
    if: >-
      github.event_name != 'pull_request' ||
      (!startsWith(github.head_ref, 'release-please--') && !startsWith(github.head_ref, 'dependabot/npm_and_yarn/non-major-dependencies-') && !startsWith(github.head_ref, 'dependabot/github_actions/actions-non-major-'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Run ${{ matrix.task }}
        run: pnpm run ${{ matrix.task }}

  public-api:
    name: Public API contract
    if: >-
      github.event_name != 'pull_request' ||
      (!startsWith(github.head_ref, 'release-please--') && !startsWith(github.head_ref, 'dependabot/npm_and_yarn/non-major-dependencies-') && !startsWith(github.head_ref, 'dependabot/github_actions/actions-non-major-'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - run: pnpm run build
      - run: pnpm run api:check

  package:
    name: Published package contents
    if: >-
      github.event_name != 'pull_request' ||
      (!startsWith(github.head_ref, 'release-please--') && !startsWith(github.head_ref, 'dependabot/npm_and_yarn/non-major-dependencies-') && !startsWith(github.head_ref, 'dependabot/github_actions/actions-non-major-'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - run: pnpm run package:validate

  docs:
    name: Documentation
    if: >-
      github.event_name != 'pull_request' ||
      (!startsWith(github.head_ref, 'release-please--') && !startsWith(github.head_ref, 'dependabot/npm_and_yarn/non-major-dependencies-') && !startsWith(github.head_ref, 'dependabot/github_actions/actions-non-major-'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - run: pnpm run docs:build
      - run: pnpm run docs:links

  browser:
    name: Browser integration
    if: >-
      github.event_name != 'pull_request' ||
      (!startsWith(github.head_ref, 'release-please--') && !startsWith(github.head_ref, 'dependabot/npm_and_yarn/non-major-dependencies-') && !startsWith(github.head_ref, 'dependabot/github_actions/actions-non-major-'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Install Chromium system dependencies
        run: pnpm --dir packages/core exec playwright install --with-deps chromium
      - name: Build browser test target
        run: pnpm nx run @strata-game-library/core:build
      - run: pnpm nx run @strata-game-library/core:test:e2e
      - name: Upload browser results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-integration-results
          path: |
            packages/core/test-results/
            packages/core/playwright-results/
          if-no-files-found: ignore
          retention-days: 7

  sonar:
    name: SonarQube Cloud analysis
    if: >-
      github.event_name != 'pull_request' ||
      (!startsWith(github.head_ref, 'release-please--') && !startsWith(github.head_ref, 'dependabot/npm_and_yarn/non-major-dependencies-') && !startsWith(github.head_ref, 'dependabot/github_actions/actions-non-major-'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      # Sourced from the Doppler-managed organization secret; this workflow
      # deliberately does not create or shadow a repository-level credential.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Scan with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1

  dependency-review:
    name: Dependency review
    if: >-
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'release-please--') &&
      !startsWith(github.head_ref, 'dependabot/npm_and_yarn/non-major-dependencies-') &&
      !startsWith(github.head_ref, 'dependabot/github_actions/actions-non-major-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  gate:
    name: CI / gate
    if: >-
      always() && (github.event_name != 'pull_request' ||
      (!startsWith(github.head_ref, 'release-please--') && !startsWith(github.head_ref, 'dependabot/npm_and_yarn/non-major-dependencies-') && !startsWith(github.head_ref, 'dependabot/github_actions/actions-non-major-')))
    needs:
      - pr-title
      - toolchain
      - compatibility
      - quality
      - public-api
      - package
      - docs
      - browser
      - sonar
      - dependency-review
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      PR_TITLE_RESULT: ${{ needs.pr-title.result }}
      TOOLCHAIN_RESULT: ${{ needs.toolchain.result }}
      COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      PUBLIC_API_RESULT: ${{ needs.public-api.result }}
      PACKAGE_RESULT: ${{ needs.package.result }}
      DOCS_RESULT: ${{ needs.docs.result }}
      BROWSER_RESULT: ${{ needs.browser.result }}
      SONAR_RESULT: ${{ needs.sonar.result }}
      DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
    steps:
      - name: Enforce all CI results
        shell: bash
        run: |
          required=(
            "$TOOLCHAIN_RESULT"
            "$COMPATIBILITY_RESULT"
            "$QUALITY_RESULT"
            "$PUBLIC_API_RESULT"
            "$PACKAGE_RESULT"
            "$DOCS_RESULT"
            "$BROWSER_RESULT"
            "$SONAR_RESULT"
          )
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            required+=("$PR_TITLE_RESULT" "$DEPENDENCY_REVIEW_RESULT")
          fi
          for result in "${required[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "A required CI job did not succeed: $result" >&2
              exit 1
            fi
          done
