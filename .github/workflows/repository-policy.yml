name: Repository Policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    name: Repository Policy / gate
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      UPSTREAM_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Protect the control plane from fork PRs
        shell: bash
        run: |
          if [[ "$HEAD_REPOSITORY" == "$UPSTREAM_REPOSITORY" ]]; then
            echo "Trusted upstream branch: control-plane maintenance is allowed."
            exit 0
          fi

          mapfile -t changed_files < <(
            gh api --paginate \
              "repos/$UPSTREAM_REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[].filename'
          )

          prohibited=()
          for file in "${changed_files[@]}"; do
            case "$file" in
              .github/workflows/*|.github/actions/*|.github/dependabot.yml|.github/settings.yml|.coderabbit.yaml|sonar-project.properties|release-please-config.json|.release-please-manifest.json)
                prohibited+=("$file")
                ;;
            esac
          done

          if (( ${#prohibited[@]} > 0 )); then
            echo "External fork PRs cannot modify repository control-plane files:" >&2
            printf ' - %s\n' "${prohibited[@]}" >&2
            echo "A maintainer or trusted agent can reproduce the change on an upstream branch." >&2
            exit 1
          fi

          echo "External fork changes stay outside the repository control plane."
