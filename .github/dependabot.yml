version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: 09:00
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      major-dependencies:
        patterns: ["*"]
        update-types: [major]
      non-major-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
      include: scope

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: 09:30
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      actions-major:
        patterns: ["*"]
        update-types: [major]
      actions-non-major:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ci(deps)
      include: scope
