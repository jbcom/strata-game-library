# SonarQube Cloud project metadata. Authentication is provided by the existing
# GitHub integration; never add a repository-specific token to this project.
sonar.organization=jbcom
sonar.projectKey=jbcom_strata-game-library
sonar.projectName=Strata Game Library

# `sonar.sources` and `sonar.tests` accept directory names only, not globs.
# Keep their roots literal and use inclusion/exclusion patterns to classify
# package-local source and test trees in this monorepo.
sonar.sources=packages,adapters,plugins
sonar.inclusions=**/src/**
sonar.tests=.
sonar.test.inclusions=packages/**/tests/**,packages/**/__tests__/**,adapters/**/tests/**,adapters/**/__tests__/**,plugins/**/tests/**,plugins/**/__tests__/**
sonar.exclusions=**/tests/**,**/__tests__/**,**/dist/**,**/coverage/**,**/node_modules/**,**/docs/**,**/test-results/**,**/*.d.ts
sonar.coverage.exclusions=**/tests/**,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

sonar.links.homepage=https://jonbogaty.com/strata-game-library/
sonar.links.scm=https://github.com/jbcom/strata-game-library
sonar.links.ci=https://github.com/jbcom/strata-game-library/actions
