# SonarQube Cloud project metadata. The access token is supplied only by the
# SONAR_TOKEN GitHub Actions secret; never commit a token to this repository.
sonar.organization=jbcom
sonar.projectKey=jbcom_strata-game-library
sonar.projectName=Strata Game Library

# Scan publishable TypeScript source while excluding build output, generated
# documentation, test fixtures, and vendor code.
sonar.sources=packages/*/src,adapters/*/src,plugins/*/src
sonar.tests=packages/*/tests,adapters/*/tests,plugins/*/tests
sonar.exclusions=**/dist/**,**/coverage/**,**/node_modules/**,**/docs/**,**/test-results/**,**/*.d.ts
sonar.coverage.exclusions=**/tests/**,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

sonar.links.homepage=https://jonbogaty.com/strata-game-library/
sonar.links.scm=https://github.com/jbcom/strata-game-library
sonar.links.ci=https://github.com/jbcom/strata-game-library/actions
