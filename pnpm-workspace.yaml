packages:
  - packages/*
  - adapters/*
  - plugins/*
  - apps/*
  # Sourcey's documentation toolchain is a first-class, locked workspace.
  - docs
# Each of these needs a postinstall to fetch or compile a native artifact:
# a browser binary, a native image codec, and the Nx daemon.
allowBuilds:
  '@playwright/browser-chromium': true
  esbuild: true
  nx: true
  sharp: true

minimumReleaseAgeExclude:
  - '@types/react-dom@19.2.5'

# Security floors live in the workspace file so current pnpm versions apply
# them consistently across every package in the monorepo.
overrides:
  minimatch: 10.2.5
  "@isaacs/brace-expansion": 5.0.9
  react: 19.2.5
  react-dom: 19.2.5
  astro: 7.2.4
  brace-expansion: 5.0.9
  esbuild: 0.28.2
  sharp: 0.35.3
  uuid: 11.1.1
